name: Android Build (WPR.UI.Android)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'UI/WPR.UI.Android/**'
      - 'UI/WPR.UI/**'
      - 'Core/**'
      - 'JavaBindings/**'
      - 'ThirdParty/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore WPR.UI.Android
        run: dotnet restore "UI/WPR.UI.Android/WPR.UI.Android.csproj"

      - name: Build WPR.UI.Android (Release)
        run: dotnet build "UI/WPR.UI.Android/WPR.UI.Android.csproj" -c Release -f net6.0-android

      - name: Find built APKs
        id: find_apk
        shell: pwsh
        run: |
          $apks = Get-ChildItem -Path "UI/WPR.UI.Android/bin/Release" -Recurse -Include *.apk
          $apks | ForEach-Object { Write-Host $_.FullName }
          if ($apks.Count -eq 0) {
            Write-Error "No APK files were produced by the build."
            exit 1
          }

      - name: Get Short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPR.UI.Android-${{ env.SHORT_SHA }}
          path: UI/WPR.UI.Android/bin/Release/**/*.apk
          if-no-files-found: error
