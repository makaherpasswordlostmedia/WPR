name: Android Build (WPR.UI.Android)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'UI/WPR.UI.Android/**'
      - 'UI/WPR.UI/**'
      - 'Core/**'
      - 'JavaBindings/**'
      - 'ThirdParty/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Must run BEFORE any dotnet workload/restore/build command,
      # otherwise the default (newer) SDK on the runner picks up the
      # android workload and marks net6.0-android as unsupported (NETSDK1202).
      - name: Pin repo to the installed .NET 8 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks
          $sdk = (dotnet --list-sdks | Select-String '^8\.' | Select-Object -First 1).ToString().Split(' ')[0]
          if (-not $sdk) { throw "No .NET 8 SDK found on this runner" }
          Write-Host "Pinning to SDK $sdk"
          @{ sdk = @{ version = $sdk; rollForward = "latestFeature" } } | ConvertTo-Json | Set-Content -Path "global.json"
          Get-Content global.json
          dotnet --version

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore WPR.UI.Android
        run: dotnet restore "UI/WPR.UI.Android/WPR.UI.Android.csproj" -p:CheckEolWorkloads=false

      - name: Build WPR.UI.Android (Release)
        run: dotnet build "UI/WPR.UI.Android/WPR.UI.Android.csproj" -c Release -f net6.0-android31.0 --no-restore -p:CheckEolWorkloads=false

      - name: Find built APKs
        shell: pwsh
        run: |
          $apks = Get-ChildItem -Path "UI/WPR.UI.Android/bin/Release" -Recurse -Include *.apk
          $apks | ForEach-Object { Write-Host $_.FullName }
          if ($apks.Count -eq 0) {
            Write-Error "No APK files were produced by the build."
            exit 1
          }

      - name: Get Short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPR.UI.Android-${{ env.SHORT_SHA }}
          path: UI/WPR.UI.Android/bin/Release/**/*.apk
          if-no-files-found: error
